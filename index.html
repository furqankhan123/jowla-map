<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jowla Map</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 16px 16px 96px; }
  h1 { font-size: 22px; }
  label { display: block; margin-top: 16px; font-weight: bold; }
  select, input { width: 100%; height: 48px; padding: 10px; margin-top: 4px; font-size: 16px; box-sizing: border-box; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: #fff; box-shadow: 0 -2px 8px rgba(0,0,0,.15); }
  .bar button { display: block; max-width: 448px; margin: 0 auto; width: 100%; height: 52px; font-size: 17px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>

<label>Status</label>
<select id="myStatus">
  <option value="All">All</option>
  <option value="S">Students</option>
  <option value="K">Khususi</option>
  <option value="F">Follow Ups</option>
  <option value="W">3D</option>
</select>

<label>Visited</label>
<select id="myVisited">
  <option value="All">All</option>
  <option value="0">Not Yet Visited</option>
  <option value="6">More than 180 days</option>
  <option value="3">More than 90 days</option>
  <option value="1">More than 30 days</option>
</select>

<label>Name contains (optional)</label>
<input id="search" type="text" placeholder="leave blank for all">

<div class="bar"><button onclick="RedirectURL()">Display Map</button></div>

<script>
function createDynamicURL() {
  var URL = 'newindex.html';
  var params = [];
  var City = document.getElementById('myCity').value;
  if (City !== 'All') {
    params.push('City===' + encodeURIComponent("'" + City + "'"));
  }
  var Status = document.getElementById('myStatus').value;
  if (Status !== 'All') {
    params.push('S=' + Status);
  }
  var search = document.getElementById('search').value || 'Search';
  params.push('F=' + encodeURIComponent(search));
  var Visit = document.getElementById('myVisited').value;
  if (Visit !== 'All') {
    params.push('P=' + Visit);
  }
  if (params.length) URL += '?' + params.join('&');
  return URL;
}
var FIELDS = ['myCity', 'myStatus', 'myVisited', 'search'];
(function restore() {
  try {
    var saved = JSON.parse(localStorage.getItem('jowla-filters') || '{}');
    FIELDS.forEach(function(id) { if (saved[id] != null) document.getElementById(id).value = saved[id]; });
  } catch (e) {}
})();
function RedirectURL() {
  try {
    var o = {};
    FIELDS.forEach(function(id) { o[id] = document.getElementById(id).value; });
    localStorage.setItem('jowla-filters', JSON.stringify(o));
  } catch (e) {}
  window.location = createDynamicURL();
}
</script>
</body>
</html>
