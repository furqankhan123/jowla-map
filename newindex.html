<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Jowla Map</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="map.css?v=0.24.0">
</head>

<body id="black">

<div id="map"></div>

<div id="fab-group">
    <button id="route-fab" class="fab" type="button" aria-label="Show route" title="Show route"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg></button>
    <button id="locate-fab" class="fab" type="button" aria-label="Go to my location" title="My location">&#9678;</button>
    <button id="cluster-fab" class="fab" type="button" aria-label="Suggest clusters" title="Suggest clusters">&#10022;</button>
    <button id="filter-fab" class="fab" type="button" aria-label="Filters" title="Filters">&#9776;</button>
    <button id="optimize-fab" class="fab" type="button" aria-label="Optimize nearby" title="Optimize nearby stops"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M8 19h6a4 4 0 0 0 0-8H10a4 4 0 0 1 0-8h6"/></svg></button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/markerclusterer-2.5.3.min.js"></script>
<script src="config.js?v=0.24.0"></script>
<script src="nav.js?v=0.24.0"></script>
<script src="logic.js?v=0.24.0"></script>
<script src="map.js?v=0.24.0"></script>
<script src="segments.js?v=0.24.0"></script>
<script src="optimize-route.js?v=0.24.0"></script>
<script src="cluster.js?v=0.24.0"></script>
<script src="tour.js?v=0.24.0"></script>
<script src="writeback.js?v=0.24.0"></script>
<script>
(function () {
  var s = document.createElement('script');
  s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(window.JOWLA_CONFIG.apiKey) + '&libraries=geometry,marker&loading=async&callback=initialiseMap';
  s.async = true; s.defer = true;
  document.head.appendChild(s);
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      function offer(w) {
        var n = 0;
        (function tryToast() {
          if (window.showToast) {
            showToast('New version available', { sticky: true, action: { label: 'Reload', onClick: function () { w.postMessage('SKIP_WAITING'); } } });
          } else if (n++ < 20) { setTimeout(tryToast, 500); }
        })();
      }
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w);
        });
      });
    }).catch(function () {});
    var reloaded = !navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (reloaded) return; reloaded = true; location.reload();
    });
  });
}
</script>
</body>
</html>
