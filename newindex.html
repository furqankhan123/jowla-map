<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#1a73e8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Jowla Map</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="map.css?v=0.13.0">
</head>

<body id="black">

<div id="map"></div>

<div id="fab-group">
    <button id="locate-fab" class="fab" type="button" aria-label="Go to my location" title="My location">&#9678;</button>
    <button id="cluster-fab" class="fab" type="button" aria-label="Suggest clusters" title="Suggest clusters">&#10022;</button>
    <button id="filter-fab" class="fab" type="button" aria-label="Filters" title="Filters">&#9776;</button>
    <button id="optimize-fab" class="fab-pill" type="button" title="Optimize the stops currently shown on the map">Optimize</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="vendor/jquery-3.1.1.min.js"></script>
<script src="config.js?v=0.13.0"></script>
<script src="nav.js?v=0.13.0"></script>
<script src="map.js?v=0.13.0"></script>
<script src="optimize-route.js?v=0.13.0"></script>
<script src="cluster.js?v=0.13.0"></script>
<script src="writeback.js?v=0.13.0"></script>
<script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBWKjSZa8wcaEEqUrjk-opBhmEVxd6GbPQ&libraries=geometry&callback=initialiseMap">
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
</body>
</html>
